<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YUKO · Sushi &amp; Fusion</title>
<meta name="description" content="YUKO Sushi & Fusion — Ardea. Prenota, ordina e seguici sui social.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0806;
    --gold-1:#f6e3a8;
    --gold-2:#d9b256;
    --gold-3:#b4832c;
    --line:rgba(217,178,86,.28);
    --line-soft:rgba(217,178,86,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Jost',system-ui,sans-serif;
    background:var(--bg);
    color:var(--gold-1);
    min-height:100vh;min-height:100dvh;
    display:flex;justify-content:center;
    padding:clamp(28px,7vw,64px) 22px calc(48px + env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  /* alone dorato molto tenue, sfuma nel nero all altezza del logo */
  .bg::before{
    content:"";position:absolute;left:50%;top:clamp(120px,24vh,240px);
    width:min(460px,110vw);aspect-ratio:1;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(217,178,86,.13),rgba(217,178,86,.03) 45%,transparent 68%);
    filter:blur(6px);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 120%,rgba(180,131,44,.08),transparent 55%),
               linear-gradient(180deg,#0a0806 0%,#0c0a07 60%,#080604 100%);
  }
  .dust{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;
    background-image:
      radial-gradient(1px 1px at 12% 32%,rgba(246,227,168,.6),transparent),
      radial-gradient(1px 1px at 82% 24%,rgba(246,227,168,.5),transparent),
      radial-gradient(1px 1px at 68% 60%,rgba(217,178,86,.5),transparent),
      radial-gradient(1px 1px at 26% 74%,rgba(217,178,86,.45),transparent),
      radial-gradient(1px 1px at 90% 66%,rgba(217,178,86,.4),transparent),
      radial-gradient(1px 1px at 8% 84%,rgba(246,227,168,.35),transparent);
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
  .logo{
    width:clamp(240px,66vw,330px);height:auto;display:block;
    filter:drop-shadow(0 8px 30px rgba(217,178,86,.28));
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
  .tag{
    margin-top:2px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:clamp(1.02rem,4.4vw,1.22rem);letter-spacing:.02em;color:var(--gold-2);
    text-align:center;opacity:.92;
  }
  .rule{width:120px;height:1px;margin:22px 0 26px;
    background:linear-gradient(90deg,transparent,var(--gold-3),transparent);position:relative}
  .rule::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;
    transform:translate(-50%,-50%) rotate(45deg);background:var(--gold-2);box-shadow:0 0 8px rgba(217,178,86,.5)}
  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:16px;padding:17px 20px;
    text-decoration:none;color:var(--gold-1);
    background:linear-gradient(180deg,rgba(30,23,10,.72),rgba(18,14,7,.72));
    border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s;
    backdrop-filter:blur(2px);animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  .link:nth-child(1){animation-delay:.10s}
  .link:nth-child(2){animation-delay:.18s}
  .link:nth-child(3){animation-delay:.26s}
  .link:nth-child(4){animation-delay:.34s}
  .link:nth-child(5){animation-delay:.42s}
  .link::before{content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(246,227,168,.22),transparent);
    transform:skewX(-18deg);transition:left .6s ease}
  .link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--gold-2);
    box-shadow:0 12px 30px -12px rgba(217,178,86,.45),inset 0 0 0 1px rgba(246,227,168,.12);outline:none}
  .link:hover::before,.link:focus-visible::before{left:130%}
  .link:active{transform:translateY(0)}
  .ic{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
    background:radial-gradient(circle at 30% 25%,rgba(246,227,168,.16),rgba(217,178,86,.05));
    border:1px solid var(--line-soft)}
  .ic svg{width:21px;height:21px;fill:var(--gold-1)}
  .txt{display:flex;flex-direction:column;line-height:1.25}
  .txt .t{font-family:'Cormorant Garamond',serif;font-size:1.32rem;font-weight:600;letter-spacing:.01em;color:var(--gold-1)}
  .txt .s{font-size:.74rem;font-weight:300;letter-spacing:.04em;color:var(--gold-2);opacity:.85;margin-top:1px}
  .arrow{margin-left:auto;flex:0 0 auto;color:var(--gold-3);opacity:.7;transition:transform .35s,opacity .35s}
  .arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .link:hover .arrow,.link:focus-visible .arrow{transform:translateX(4px);opacity:1}
  footer{margin-top:34px;text-align:center;font-size:.72rem;letter-spacing:.14em;color:var(--gold-3);opacity:.6;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){.logo,.link{animation:none}.link,.link::before,.arrow{transition:none}}
</style>
</head>
